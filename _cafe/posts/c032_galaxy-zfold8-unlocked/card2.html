<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{word-break:keep-all;width:1080px;font-family:"Noto Sans CJK KR",sans-serif;background:#ecfeff;color:#083344;padding:70px 72px 64px}
h1{font-size:54px;font-weight:900}.sub{font-size:27px;color:#155e75;margin:10px 0 46px}
.s{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.box{flex:1;background:#fff;border:3px solid #a5f3fc;border-radius:20px;padding:26px 28px}
.box .l{font-size:25px;color:#0e7490;font-weight:700}.box .v{font-size:44px;font-weight:900;margin-top:6px}
.op{font-size:50px;font-weight:900;color:#0e7490;width:44px;text-align:center}
.big{background:#155e75;color:#fff;border-radius:26px;padding:40px 36px;text-align:center}
.big .l{font-size:30px;color:#a5f3fc}.big .v{font-size:96px;font-weight:900;margin-top:6px}
.n{margin-top:28px;font-size:26px;color:#155e75;line-height:1.5}

<h1>선택약정 25% 계산 예시</h1><div class="sub">월 6만 9,000원 요금제를 쓴다고 가정</div>
<div class="s"><div class="box"><div class="l">월 요금</div><div class="v">69,000원</div></div><div class="op">×</div><div class="box"><div class="l">할인율</div><div class="v">25%</div></div></div>
<div class="s"><div class="box"><div class="l">월 할인</div><div class="v">17,250원</div></div><div class="op">×</div><div class="box"><div class="l">기간</div><div class="v">24개월</div></div></div>
<div class="big"><div class="l">2년 할인 합계</div><div class="v">414,000원</div></div>
<div class="n">통신사 공시지원금이 이보다 크면 통신사, 작으면 자급제가 유리합니다.</div>
</body></html>
