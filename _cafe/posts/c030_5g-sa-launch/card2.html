<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{word-break:keep-all;width:1080px;font-family:"Noto Sans CJK KR",sans-serif;background:#f4f4f6;color:#1f1f24;padding:64px 64px 60px}
h1{font-size:56px;font-weight:900}.sub{font-size:27px;color:#5d5d6a;margin:12px 0 40px}
.w{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.c{border-radius:24px;padding:32px 30px;background:#fff;border:4px solid #c9c9d2}
.c.sa{border-color:#d62828}
.c h2{font-size:40px;font-weight:900;margin-bottom:6px}.c .e{font-size:25px;color:#5d5d6a;margin-bottom:24px}
.flow{display:flex;flex-direction:column;gap:12px}
.s{border-radius:14px;padding:18px 20px;font-size:28px;font-weight:700;text-align:center}
.g{background:#e3e3ea}.r{background:#d62828;color:#fff}
.ar{text-align:center;font-size:28px;color:#8a8a96;line-height:1}
.pt{margin-top:22px;font-size:26px;line-height:1.55}
.q{margin-top:30px;background:#1f1f24;color:#fff;border-radius:20px;padding:26px 32px;font-size:28px;line-height:1.55}
.q b{color:#ff8a8a}
</style></head><body>
<h1>NSA와 SA, 무엇이 다를까</h1><div class="sub">비단독모드 vs 단독모드</div>
<div class="w">
<div class="c"><h2>NSA</h2><div class="e">비단독모드 (기존 SKT·LG유플러스)</div>
<div class="flow"><div class="s g">5G 기지국</div><div class="ar">↓</div><div class="s g">LTE 핵심망에 의존</div></div>
<div class="pt">데이터는 5G, 접속·제어는 LTE</div></div>
<div class="c sa"><h2>SA</h2><div class="e">단독모드 (3사 전국망)</div>
<div class="flow"><div class="s r">5G 기지국</div><div class="ar">↓</div><div class="s r">5G 핵심망</div></div>
<div class="pt">처음부터 끝까지 5G<br>네트워크 슬라이싱 가능</div></div>
</div>
<div class="q"><b>내가 할 일</b><br>· 별도 설정·요금제 변경 공식 안내는 아직 없음<br>· 통신사 공지에서 내 기종 대상 여부 확인</div>
</body></html>
