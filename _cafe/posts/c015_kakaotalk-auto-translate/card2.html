<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;font-family:"Noto Sans CJK KR",sans-serif;background:#2f3437;color:#fff;padding:76px 60px 70px}

<h1>자동번역 안 될 때</h1><div class="sub">증상별로 바로 확인</div>

<div class="row"><div class="p">메뉴가 아예 없다</div><div class="s">카카오톡 26.10.0 이상인지</div></div>
<div class="row"><div class="p">켰는데 그대로 외국어</div><div class="s">카나나 연구소·채팅방 둘 다 켰는지</div></div>
<div class="row"><div class="p">내 메시지는 번역 안 됨</div><div class="s">받은 메시지만 번역 (보도 기준)</div></div>
<div class="row"><div class="p">업데이트 후 반응 없음</div><div class="s">앱 완전 종료 후 다시 실행</div></div></body></html>
